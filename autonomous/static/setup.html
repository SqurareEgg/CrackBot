<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrackBot 연결 설정</title>
<style>
  :root {
    --bg: #111110; --panel: #1a1a18; --border: rgba(255,255,255,0.12);
    --text: #f2f2ef; --text-dim: rgba(242,242,239,0.6);
    --accent: #1D9E75; --danger: #E24B4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 18px; font-weight: 700; margin: 4px 0 0; }
  p.sub { font-size: 13px; color: var(--text-dim); margin: 0; text-align: center; max-width: 420px; }

  .card {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; }
  .card-head span { font-size: 14px; font-weight: 700; }
  .refresh-btn {
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: #2a2a27; border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; cursor: pointer;
  }
  .refresh-btn:hover { color: var(--text); }

  .list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .list .empty { font-size: 13px; color: var(--text-dim); padding: 8px 2px; }
  .item {
    font-family: inherit; text-align: left; font-size: 14px; color: var(--text);
    background: #222220; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
  }
  .item .meta { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .item.selected { border-color: var(--accent); background: rgba(29,158,117,0.15); }

  .connect-btn {
    width: 100%; max-width: 420px; padding: 14px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  .connect-btn:disabled { background: #2a2a27; color: var(--text-dim); cursor: default; }

  .error { font-size: 13px; color: var(--danger); text-align: center; max-width: 420px; min-height: 16px; }

  .already {
    width: 100%; max-width: 420px; background: rgba(29,158,117,0.12); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; font-size: 13px; display: none;
    align-items: center; justify-content: space-between; gap: 10px;
  }
  .already a {
    color: #fff; background: var(--accent); padding: 7px 14px; border-radius: 8px;
    text-decoration: none; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>CrackBot 자율주행 연결 설정</h1>
<p class="sub">차량 시리얼 포트와 카메라를 선택하고 연결하세요. 둘 다 PC에 꽂혀있어야 목록에 보입니다.</p>

<div class="already" id="already">
  <span id="alreadyText"></span>
  <a href="/control">조작 패널로 이동</a>
</div>

<div class="card">
  <div class="card-head">
    <span>시리얼 포트</span>
    <button class="refresh-btn" id="refreshPorts">새로고침</button>
  </div>
  <div class="list" id="portList"><div class="empty">스캔 중...</div></div>
</div>

<div class="card">
  <div class="card-head">
    <span>카메라</span>
    <button class="refresh-btn" id="refreshCameras">새로고침</button>
  </div>
  <div class="list" id="cameraList"><div class="empty">스캔 중...</div></div>
</div>

<div class="error" id="error"></div>
<button class="connect-btn" id="connectBtn" disabled>연결</button>

<script>
let selectedPort = null;
let selectedCamera = null;

const portList = document.getElementById('portList');
const cameraList = document.getElementById('cameraList');
const connectBtn = document.getElementById('connectBtn');
const errorBox = document.getElementById('error');
const alreadyBox = document.getElementById('already');
const alreadyText = document.getElementById('alreadyText');

function updateConnectEnabled() {
  connectBtn.disabled = !(selectedPort && selectedCamera !== null);
}

async function loadPorts() {
  portList.innerHTML = '<div class="empty">스캔 중...</div>';
  selectedPort = null;
  updateConnectEnabled();
  const data = await (await fetch('/ports')).json();
  portList.innerHTML = '';
  if (!data.ports.length) {
    portList.innerHTML = '<div class="empty">포트를 찾을 수 없습니다. 동글을 꽂았는지 확인하세요.</div>';
    return;
  }
  data.ports.forEach((p) => {
    const el = document.createElement('button');
    el.className = 'item';
    const name = document.createElement('span');
    name.textContent = p.device;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = p.description || '';
    el.appendChild(name);
    el.appendChild(meta);
    el.addEventListener('click', () => {
      selectedPort = p.device;
      portList.querySelectorAll('.item').forEach((x) => x.classList.toggle('selected', x === el));
      updateConnectEnabled();
    });
    portList.appendChild(el);
  });
}

async function loadCameras() {
  cameraList.innerHTML = '<div class="empty">스캔 중... (몇 초 걸릴 수 있어요)</div>';
  selectedCamera = null;
  updateConnectEnabled();
  const data = await (await fetch('/cameras')).json();
  cameraList.innerHTML = '';
  if (!data.cameras.length) {
    cameraList.innerHTML = '<div class="empty">카메라를 찾을 수 없습니다. 동글을 꽂았는지 확인하세요.</div>';
    return;
  }
  data.cameras.forEach((c) => {
    const el = document.createElement('button');
    el.className = 'item';
    const name = document.createElement('span');
    name.textContent = `카메라 ${c.index}`;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${c.width}x${c.height}`;
    el.appendChild(name);
    el.appendChild(meta);
    el.addEventListener('click', () => {
      selectedCamera = c.index;
      cameraList.querySelectorAll('.item').forEach((x) => x.classList.toggle('selected', x === el));
      updateConnectEnabled();
    });
    cameraList.appendChild(el);
  });
}

document.getElementById('refreshPorts').addEventListener('click', loadPorts);
document.getElementById('refreshCameras').addEventListener('click', loadCameras);

connectBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  connectBtn.disabled = true;
  connectBtn.textContent = '연결 중...';
  try {
    const res = await fetch('/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ port: selectedPort, camera_index: selectedCamera }),
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/control';
    } else {
      errorBox.textContent = data.error || '연결에 실패했습니다.';
      connectBtn.disabled = false;
      connectBtn.textContent = '연결';
    }
  } catch (e) {
    errorBox.textContent = '서버에 연결할 수 없습니다.';
    connectBtn.disabled = false;
    connectBtn.textContent = '연결';
  }
});

async function checkAlready() {
  try {
    const s = await (await fetch('/state')).json();
    if (s.connected) {
      alreadyText.textContent = `이미 연결됨 — ${s.port}, 카메라 ${s.camera_index}`;
      alreadyBox.style.display = 'flex';
    }
  } catch (e) { /* ignore */ }
}

checkAlready();
loadPorts();
loadCameras();
</script>

</body>
</html>
