<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrackBot AI — ERD</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f4f0;
  --color-text-primary: #1a1a18;
  --color-text-secondary: #5f5e5a;
  --color-border-tertiary: rgba(0,0,0,0.10);
  --color-border-secondary: rgba(0,0,0,0.18);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary: #1e1e1c;
    --color-background-secondary: #2a2a27;
    --color-text-primary: #e8e6df;
    --color-text-secondary: #9c9a92;
    --color-border-tertiary: rgba(255,255,255,0.10);
    --color-border-secondary: rgba(255,255,255,0.18);
  }
}
body {
  font-family: var(--font-sans);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
}
.header { margin-bottom: 20px; }
.doc-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.doc-meta { font-size: 12px; color: var(--color-text-secondary); display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.domain-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.chip { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.chip-teal   { background: #E1F5EE; color: #0F6E56; }
.chip-blue   { background: #E6F1FB; color: #185FA5; }
.chip-purple { background: #EEEDFE; color: #534AB7; }
.chip-amber  { background: #FAEEDA; color: #854F0B; }
@media (prefers-color-scheme: dark) {
  .chip-teal   { background: #085041; color: #9FE1CB; }
  .chip-blue   { background: #0C447C; color: #B5D4F4; }
  .chip-purple { background: #3C3489; color: #CECBF6; }
  .chip-amber  { background: #633806; color: #FAC775; }
}
#erd { overflow-x: auto; }
#erd svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div class="header">
  <div class="doc-title">CrackBot AI — ERD (Entity Relationship Diagram)</div>
  <div class="doc-meta">
    <span>프로젝트: CrackBot AI</span>
    <span>DB: PostgreSQL 15</span>
    <span>ORM: SQLAlchemy 2.x</span>
    <span>버전: v0.1</span>
    <span>2026. 3. 25.</span>
  </div>
  <div class="domain-chips">
    <span class="chip chip-teal">도메인 1 · 사용자/인증</span>
    <span class="chip chip-blue">도메인 2 · 건축물/점검 프로젝트</span>
    <span class="chip chip-purple">도메인 3 · 결함 탐지 결과</span>
    <span class="chip chip-amber">도메인 4 · 보고서</span>
  </div>
</div>
<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    lineColor:  dark ? '#9c9a92' : '#73726c',
    textColor:  dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor:             dark ? '#2a2a27' : '#f5f4f0',
    primaryBorderColor:       dark ? '#444441' : '#B4B2A9',
    attributeBackgroundColorEven: dark ? '#222220' : '#fafaf8',
    attributeBackgroundColorOdd:  dark ? '#2a2a27' : '#f5f4f0',
  },
  er: {
    diagramPadding: 30,
    layoutDirection: 'TB',
    minEntityWidth: 100,
    minEntityHeight: 75,
    entityPadding: 15,
    useMaxWidth: true
  }
});

const diagram = `erDiagram
  USERS {
    uuid      id              PK
    varchar   email           UK
    varchar   password_hash
    varchar   name
    enum      role
    boolean   is_active
    timestamp created_at
    timestamp updated_at
  }

  REFRESH_TOKENS {
    uuid      id          PK
    uuid      user_id     FK
    varchar   token       UK
    timestamp expires_at
    boolean   is_revoked
    timestamp created_at
  }

  BUILDINGS {
    uuid      id          PK
    varchar   name
    varchar   address
    float     latitude
    float     longitude
    integer   floors
    integer   built_year
    timestamp created_at
  }

  INSPECTION_PROJECTS {
    uuid      id            PK
    uuid      building_id   FK
    uuid      inspector_id  FK
    varchar   title
    enum      status
    date      start_date
    date      end_date
    timestamp created_at
    timestamp updated_at
  }

  INSPECTION_ZONES {
    uuid      id           PK
    uuid      project_id   FK
    varchar   zone_name
    integer   floor
    enum      grade
    integer   photo_count
    timestamp created_at
  }

  INSPECTION_PHOTOS {
    uuid      id           PK
    uuid      zone_id      FK
    varchar   s3_key
    varchar   s3_url
    float     latitude
    float     longitude
    timestamp taken_at
    boolean   is_analyzed
    timestamp created_at
  }

  DEFECT_DETECTIONS {
    uuid      id              PK
    uuid      photo_id        FK
    enum      defect_type
    float     confidence
    json      bbox
    float     crack_width_mm
    enum      severity
    timestamp created_at
  }

  SAFETY_GRADES {
    uuid      id            PK
    uuid      project_id    FK
    uuid      zone_id       FK
    enum      grade
    integer   defect_count
    float     max_crack_mm
    text      recommendation
    timestamp graded_at
  }

  REPORTS {
    uuid      id              PK
    uuid      project_id      FK
    uuid      created_by      FK
    enum      template_type
    enum      format
    enum      status
    varchar   docx_s3_key
    varchar   pdf_s3_key
    timestamp generated_at
    timestamp created_at
  }

  USERS              ||--o{ REFRESH_TOKENS      : "발급"
  USERS              ||--o{ INSPECTION_PROJECTS : "담당"
  USERS              ||--o{ REPORTS             : "생성"
  BUILDINGS          ||--o{ INSPECTION_PROJECTS : "대상"
  INSPECTION_PROJECTS ||--o{ INSPECTION_ZONES   : "포함"
  INSPECTION_PROJECTS ||--o{ SAFETY_GRADES      : "판정"
  INSPECTION_PROJECTS ||--o{ REPORTS            : "생성"
  INSPECTION_ZONES   ||--o{ INSPECTION_PHOTOS   : "촬영"
  INSPECTION_ZONES   ||--o{ SAFETY_GRADES       : "구역별"
  INSPECTION_PHOTOS  ||--o{ DEFECT_DETECTIONS   : "분석"
`;

const { svg } = await mermaid.render('erd-inner', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll(
  '#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path'
).forEach(p => p.setAttribute('stroke', 'none'));
</script>
</body>
</html>
