services:
  backend:
    build: ./backend
    container_name: crackbot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/crackbot.db
      SECRET_KEY: crackbot-secret-2026-change-this
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      S3_BUCKET_NAME: ""
    volumes:
      - crackbot-db:/app/data
      - crackbot-uploads:/app/uploads
    expose:
      - "8000"

  frontend:
    image: nginx:alpine
    container_name: crackbot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  crackbot-db:
  crackbot-uploads:
